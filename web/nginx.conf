server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Autorise micro, caméra, localisation et plein écran pour la page elle-même
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), fullscreen=(self)" always;

  location /api/ {
    proxy_pass http://stroyco-horror-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 3m;
    proxy_read_timeout 60s;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
